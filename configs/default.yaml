data:
  category: Video_Games
split:
  val_fraction: 0.10      # share of interactions (by time) used for validation
  test_fraction: 0.10     # share of interactions (by time) used for test
eval:
  k_values: [10, 20, 100]
als:
  factors: 64
  regularization: 0.01
  iterations: 15
  alpha: 40
two_tower:
  embedding_dim: 64
  output_dim: 64
  epochs: 20
  batch_size: 1024
  learning_rate: 0.03
  temperature: 0.3
baselines:
  recent_window_days: 90
  item_cf_neighbors: 50
ranking:
  candidates_per_retriever: 100
  holdout_fraction: 0.2        # share of validation users held out to stop boosting early
  early_stopping_rounds: 30
  lightgbm:
    n_estimators: 500
    learning_rate: 0.05
    num_leaves: 31
    min_child_samples: 50
    subsample: 0.8
    subsample_freq: 1
    colsample_bytree: 0.8
