[package]
name = "recsys"
version = "0.2.0"
edition = "2021"
description = "Two-stage recommender: candidate generation, LambdaMART ranking, A/B analysis, serving"

[dependencies]
anyhow = "1"
axum = "0.8"
bincode = { version = "2", features = ["serde"] }
clap = { version = "4", features = ["derive", "env"] }
csv = "1"
matrixmultiply = { version = "0.3", features = ["threading"] }
rand = "0.9"
rand_chacha = "0.9"
rand_distr = "0.5"
rayon = "1"
redis = { version = "0.32", features = ["tokio-comp", "connection-manager"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
statrs = "0.18"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "process"] }

[dev-dependencies]
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
